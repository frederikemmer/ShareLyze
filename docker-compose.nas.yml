services:
  sharelyze:
    image: ghcr.io/frederikemmer/sharelyze:dev
    container_name: sharelyze
    hostname: sharelyze
    restart: unless-stopped
    networks:
      - docker_bridge
    ports:
      - "${HOST_PORT:-8080}:3000"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the external HTTPS origin}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a random setup token of at least 32 characters}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ${DATA_HOST_DIR:-./data}:/data
      # Optional separate mounts: /data/config, /data/database, /data/uploads, /data/previews
      - ${MEDIATHEK_HOST_DIR:-/volume1/Mediathek}:/sources/Mediathek:ro
      - ${FE_HOST_DIR:-/volume1/FE}:/sources/FE:ro

networks:
  docker_bridge:
    external: true
