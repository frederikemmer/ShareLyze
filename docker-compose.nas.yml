services:
  sharelyze:
    image: ghcr.io/frederikemmer/sharelyze:dev
    container_name: sharelyze
    hostname: sharelyze
    restart: unless-stopped
    networks:
      - docker_bridge
    ports:
      - "${HOST_PORT:-8080}:3000"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the external HTTPS origin}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a random setup token of at least 32 characters}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-30}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SOURCES_JSON: '[{"id":"mediathek","name":"Mediathek","root":"/share/Mediathek"},{"id":"fe","name":"FE","root":"/share/FE"}]'
    volumes:
      - ${CONFIG_HOST_DIR:-./config}:/data
      - ${MEDIATHEK_HOST_DIR:-/volume1/Mediathek}:/share/Mediathek:ro
      - ${FE_HOST_DIR:-/volume1/FE}:/share/FE:ro

networks:
  docker_bridge:
    external: true
