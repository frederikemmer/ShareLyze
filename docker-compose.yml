services:
  sharelyze:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the HTTPS public origin}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a random setup token of at least 32 characters}
      SOURCES_JSON: ${SOURCES_JSON:-[]}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-30}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - sharelyze-data:/data
      # Add your own sources below and reference container paths in SOURCES_JSON.
      # - /your/nas/files:/sources/files:ro
volumes:
  sharelyze-data:
