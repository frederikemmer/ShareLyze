services:
  sharelyze:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the HTTPS public origin}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a random setup token of at least 32 characters}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ${DATA_HOST_DIR:-./data}:/data
      # Optional separate mounts: /data/config, /data/database, /data/uploads, /data/previews
      # Add read-only sources below; the directory name becomes the source name.
      # - /your/nas/files:/sources/files:ro
