function totalPills(es){return metrics.map(m=>`<button class="metric-toggle" data-metric="${m.key}" aria-pressed="${visible.has(m.key)}" style="--c:var(${m.color})"><i class="metric-dot"></i>${m.label}<b>${sum(es,m.key)}</b></button>`).join('')}
function graphShell(){return `<div class="private-graph"><div class="graph-top"><div><h2>${concept===1?'Aufrufe und Übertragungen auf einer Zeitachse':concept===2&&view==='detail'?'Was über die Zeit zusammenkommt':concept===2?'Tage, an denen etwas passiert ist':'Alle Ereignisse gemeinsam'}</h2><p>${spanText()}</p></div><div class="periods" aria-label="Zeitraum">${['90','30','7',...(view==='detail'?['day','live']:[])].map(p=>`<button data-period="${p}" aria-pressed="${period===p}">${p==='day'?'Tag':p==='live'?'Live':p+' Tage'}</button>`).join('')}</div></div><div class="graph-tools">${totalPills(scoped())}${period==='day'?`<label class="date-select">Datum <input type="date" value="${day}" min="2026-08-09" max="2026-11-06" aria-label="Tag auswählen"></label>`:''}${period==='live'?`<button data-pause class="live-pause">${paused?'Fortsetzen':'Pause'}</button><span class="small-muted">Demo · 1 Ereignis alle 8 Sekunden</span>`:''}</div><div id="graph"></div><div id="reading"></div><div id="chart-control"></div><div class="graph-note">${icon('Info')}<span>${concept===2&&view==='detail'?'Kumuliert im gewählten Zeitraum: flache Abschnitte bedeuten keine neuen Ereignisse.':concept===1?'Jeder Punkt steht für Ereignisse. Leere Abschnitte sind bewusst sichtbar.':'Gezählt werden Anfragen, keine eindeutigen Personen. Auch null ist hier eine nützliche Information.'}</span></div></div>`}
function banner(){const es=scoped(),last=es.length?Math.max(...es.map(e=>e.t)):null,active=new Set(es.map(e=>iso(e.t))).size;const idle=period==='day'?null:period==='live'?null:Number(period)-active;return `<div class="context-banner">${icon('Clock')}<div class="context-main"><strong>${period==='live'?'Warten auf den nächsten Abruf':last?`Zuletzt etwas passiert: ${date(last)}, ${time(last)} Uhr`:'In diesem Zeitraum ist es ruhig'}</strong><p>${view==='overview'?'Deine privaten Freigaben an Familie und Freunde.':shares[share].desc+'.'} ${period==='live'?'Die Live-Demo startet leer; neue Beispielereignisse erscheinen nach und nach.':`${sum(es,'view')} Aufrufe und ${sum(es,'start')} Downloadstarts im gewählten Zeitraum.`}</p></div>${idle!==null?`<div class="quiet-days"><strong>${idle}</strong><small>Tage ohne Ereignis</small></div>`:''}</div>`}
function rows(){const es=scoped();return shares.map((s,i)=>{const se=es.filter(e=>e.s===i),last=se.length?Math.max(...se.map(e=>e.t)):null;return `<div class="share-entry"><span class="private-icon">${icon(i===2?'File':'FolderOpen')}</span><div class="identity"><button data-open="${i}">${s.name} ${icon('ArrowUpRight')}</button><small>${s.slug} · ${last?'zuletzt '+date(last):'keine Abrufe im Zeitraum'}</small></div><div class="tiny-metrics"><span title="Aufrufe">${icon('Eye')}${sum(se,'view')}</span><span title="Downloadstarts">${icon('Download')}${sum(se,'start')}</span></div></div>`}).join('')}
function eventRows(es){if(!es.length)return '<div class="nothing">Keine Ereignisse in dieser Auswahl.<br>Das ist bei privaten Freigaben ganz normal.</div>';return [...es].sort((a,b)=>b.t-a.t).slice(0,12).map(e=>{const m=metrics.find(m=>m.key===e.k);return `<div class="event-row" style="--c:var(${m.color})"><i class="event-mark"></i><div class="event-body">${e.k==='view'?'Freigabe aufgerufen':e.k==='start'?'Download angefragt':'Serverübertragung beendet'}<small>${view==='overview'?shares[e.s].name:shares[e.s].file} · ${e.agent}</small><details><summary>Abrufdetails</summary><p>${new Date(e.t).toISOString().replace('T',' ').replace('.000Z',' UTC')}<br>Beispiel-IP: 192.0.2.${10+e.s} · Herkunft unbekannt<br>Standort: nicht verfügbar · Identität: nicht bestimmbar</p></details></div><time>${date(e.t)}<br>${time(e.t)}</time></div>`}).join('')}
function devices(){const map={};for(const e of scoped().filter(e=>e.k==='view'))map[e.agent]=(map[e.agent]||0)+1;return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([a,n])=>`<div class="device-row"><span>${a}</span><b>${n} ${n===1?'Aufruf':'Aufrufe'}</b></div>`).join('')||'<p class="nothing">Noch keine Browserangaben im Zeitraum.</p>'}
function stats(){const es=scoped(),last=es.length?Math.max(...es.map(e=>e.t)):null,active=new Set(es.map(e=>iso(e.t))).size;return `<div class="stat-strip"><div><small>Aktive Tage</small><strong>${active}</strong><p>Mit mindestens einem Ereignis</p></div><div><small>Letztes Ereignis</small><strong>${last?date(last):'—'}</strong><p>${last?time(last)+' Uhr · UTC':'Keine Ereignisse im Zeitraum'}</p></div><div><small>Dateien mit Downloadstarts</small><strong>${new Set(es.filter(e=>e.k==='start').map(e=>e.s)).size}</strong><p>${view==='detail'?shares[share].file:'Im gewählten Zeitraum'}</p></div><div><small>Erfasste Browser-/OS-Kombinationen</small><strong>${new Set(es.filter(e=>e.k==='view').map(e=>e.agent)).size}</strong><p>Keine Zahl eindeutiger Personen</p></div></div>`}
function below(){return `${view==='detail'?stats():''}<div class="below"><div class="sub-panel"><div class="sub-panel-head"><h2>${view==='overview'?'Deine Freigaben':'Ereignisse zum ausgewählten Zeitpunkt'}</h2><span class="small-muted">${view==='overview'?'Link öffnen für Details':'UTC'}</span></div>${view==='overview'?rows():'<div id="selected-events"></div>'}</div><div class="sub-panel"><h2>${view==='overview'?'Letzte Ereignisse':'Browser & Geräte'}</h2>${view==='overview'?eventRows(scoped().slice(-4)):devices()+'<p class="small-muted" style="margin-top:19px">Angaben aus dem User-Agent. Mehrere Geräte können derselben Person gehören; mehrere Personen können dasselbe Gerät nutzen.</p>'}</div></div>`}
function aside(){const es=scoped();return `<aside class="journal-aside"><div class="day-note"><span class="small-muted">Aufrufe</span><strong>${sum(es,'view')}</strong><p>Auch wiederholte Aufrufe zählen.</p></div><div class="day-note"><span class="small-muted">Downloadstarts</span><strong>${sum(es,'start')}</strong><p>Kann Wiederaufnahmen enthalten.</p></div><div class="day-note"><span class="small-muted">Serverabschlüsse</span><strong>${sum(es,'finish')}</strong><p>Keine Speicherbestätigung auf dem Gerät.</p></div></aside>`}
function render(){const focused=document.activeElement?.dataset?.metric;document.querySelector('#app').className=['calm','journal','album'][concept];document.querySelector('#app').innerHTML=`<nav class="switcher" aria-label="Konzeptauswahl">${['Ruhiger Überblick','Abruf-Tagebuch','Langzeit-Album'].map((n,i)=>`<button data-concept="${i}" aria-pressed="${i===concept}">0${i+1} ${n}</button>`).join('')}<span class="sample">Privat · Beispieldaten</span></nav><div class="crumb"><button data-overview>Statistiken</button>${view==='detail'?`<span>/</span><span>${shares[share].name}</span>`:'<span>/ Alle Freigaben</span>'}</div><div class="private-heading"><div><span class="eyeline">${view==='detail'?'Für Familie & Freunde':'In deinem kleinen Kreis'}</span><h1>${view==='detail'?shares[share].name:concept===1?'Ein kleines Abruf-Tagebuch.':concept===2?'Geteilt. Und später wiedergefunden.':'Was mit deinen Freigaben passiert.'}</h1><p>${view==='detail'?shares[share].slug+' · '+shares[share].desc+' · geteilt am '+shares[share].created: 'Ein paar Links, gelegentliche Abrufe — und genug Zeit dazwischen.'}</p></div>${view==='detail'?`<select id="share-switch" aria-label="Freigabe auswählen">${shares.map((s,i)=>`<option value="${i}" ${i===share?'selected':''}>${s.name}</option>`).join('')}</select>`:'<button data-open="0">'+icon('ChartNoAxesCombined')+' Einzel-Link ansehen</button>'}</div>${banner()}${concept===1?'<div class="lane-layout">'+graphShell()+aside()+'</div>':graphShell()}${below()}<footer class="private-footer"><span>ShareLyze · ${title()} · Alle Daten sind erfunden.<br>Aufrufe ≠ Personen. Serverabschlüsse ≠ nachweislich gespeicherte Dateien.</span><span>${view==='detail'?'Einzel-Link-Ansicht':'Gesamtübersicht'} · ${period==='live'?'Live-Simulation':'Beispielstand 06. November 2026'}<br>Keine Zuordnung zu Familienmitgliedern oder Freunden.</span></footer>`;draw();if(focused)document.querySelector(`[data-metric="${focused}"]`)?.focus({preventScroll:true})}
function draw(){const rows=bins();if(selected<0||selected>=rows.length){const last=rows.findLastIndex(r=>r.es.length);selected=last>=0?last:rows.length-1}if(concept===2&&view==='overview'&&!['day','live'].includes(period)){calendar();return}const active=metrics.filter(m=>visible.has(m.key)),cumulative=concept===2&&view==='detail'&&!['day','live'].includes(period);const values={};for(const m of metrics){let total=0;values[m.key]=rows.map(r=>cumulative?(total+=r[m.key]):r[m.key])}
const max=Math.ceil(Math.max(2,...active.flatMap(m=>values[m.key]))/2)*2;const x=i=>50+i*780/Math.max(1,rows.length-1),y=v=>187-v/max*145;const tick=period==='live'||period==='day'?r=>time(r.t):r=>date(r.t);let plot='';
if(concept===1){plot=metrics.map((m,j)=>`<line x1="50" x2="830" y1="${49+j*61}" y2="${49+j*61}" stroke="var(--border)"/><text x="4" y="${34+j*61}">${['V','D','✓'][j]}</text>${visible.has(m.key)?rows.map((r,i)=>r[m.key]?`<circle cx="${x(i)}" cy="${49+j*61}" r="${5+Math.min(3,r[m.key])}" fill="var(${m.color})"/>`:'').join(''):''}`).join('')}
else {plot=[0,1,2].map(i=>`<line x1="50" x2="830" y1="${y(max*i/2)}" y2="${y(max*i/2)}" stroke="var(--border)" stroke-dasharray="3 5"/><text x="5" y="${y(max*i/2)+4}">${Number((max*i/2).toFixed(1))}</text>`).join('');for(const m of active){if(cumulative){let path=`M ${x(0)} ${y(values[m.key][0])}`;for(let i=1;i<rows.length;i++)path+=` H ${x(i)} V ${y(values[m.key][i])}`;plot+=`<path d="${path}" fill="none" stroke="var(${m.color})" stroke-width="2"/>`}else{const width=Math.max(1.8,Math.min(8,780/rows.length/4));plot+=rows.map((r,i)=>r[m.key]?`<rect x="${x(i)+(metrics.indexOf(m)-1)*(width+1)-width/2}" y="${y(r[m.key])}" width="${width}" height="${187-y(r[m.key])}" rx="1.5" fill="var(${m.color})"/>`:'').join('')}}}
plot+=[0,Math.floor((rows.length-1)/2),rows.length-1].map((i,j)=>`<text x="${x(i)}" y="219" text-anchor="${['start','middle','end'][j]}">${tick(rows[i])}</text>`).join('');plot+='<line id="cross" y1="22" y2="190" stroke="var(--foreground)" opacity=".5" stroke-dasharray="3 4"/>';
document.querySelector('#graph').innerHTML=`<svg class="chart-svg" viewBox="0 0 880 235" preserveAspectRatio="none" role="img" aria-label="${concept===1?'Ereignisspuren':cumulative?'Kumulierter Verlauf':'Ereignisse je Zeitpunkt'}: Aufrufe, Downloadstarts und Serverabschlüsse. Werte über den Regler auswählen.">${plot}</svg>`;
document.querySelector('#chart-control').innerHTML=`<input type="range" min="0" max="${rows.length-1}" value="${selected}" aria-label="Zeitpunkt auswählen"><div class="chart-foot"><span>Tippen, ziehen oder mit ← / → auswählen</span><span>${concept===1?'Spuren: V = Aufrufe · D = Starts · ✓ = Abschlüsse':cumulative?'Summen seit Beginn des Zeitraums':'Absolute Ereigniszahlen · keine Glättung'}</span></div>`;
const svg=document.querySelector('.chart-svg');svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pointer(e)});svg.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||svg.hasPointerCapture(e.pointerId))pointer(e)});function pointer(e){const r=svg.getBoundingClientRect();selected=Math.max(0,Math.min(rows.length-1,Math.round(((e.clientX-r.left)/r.width*880-50)/780*(rows.length-1))));read(rows,values,cumulative)}
document.querySelector('input[type=range]').addEventListener('input',e=>{selected=+e.target.value;read(rows,values,cumulative)});read(rows,values,cumulative)}
function read(rows,values,cumulative=false){const r=rows[selected];const stamp=period==='day'||period==='live'?time(r.t):date(r.t);const cross=document.querySelector('#cross');if(cross){cross.setAttribute('x1',50+selected*780/Math.max(1,rows.length-1));cross.setAttribute('x2',50+selected*780/Math.max(1,rows.length-1))}document.querySelector('#reading').innerHTML=`<div class="reading"><span class="reading-date">${stamp}${cumulative?' · bis zu diesem Tag':''}</span>${metrics.filter(m=>visible.has(m.key)).map(m=>`<span class="reading-value" style="--c:var(${m.color})"><i class="metric-dot"></i><b>${values?values[m.key][selected]:r[m.key]}</b>${m.label}</span>`).join('')}${view==='detail'&&!['day','live'].includes(period)?'<button class="read-day" data-drill>Tag ansehen →</button>':''}</div>`;const slider=document.querySelector('input[type=range]');if(slider){slider.value=selected;slider.setAttribute('aria-valuetext',`${stamp}: ${metrics.map(m=>`${r[m.key]} ${m.label}`).join(', ')}`)}const eventTarget=document.querySelector('#selected-events');if(eventTarget)eventTarget.innerHTML=eventRows(r.es);document.querySelector('[data-drill]')?.addEventListener('click',()=>{day=iso(r.t);period='day';selected=-1;render()})}
function calendar(){const [a,b]=bounds(),first=Date.UTC(2026,month,1),last=Date.UTC(2026,month+1,0),pad=(new Date(first).getUTCDay()+6)%7;const es=scoped();const rows=[];let html=`<div class="calendar-title"><strong>${new Date(first).toLocaleDateString('de-DE',{month:'long',year:'numeric',timeZone:'UTC'})}</strong><div class="month-nav"><button data-month="-1" aria-label="Vorheriger Monat" ${month<=new Date(a).getUTCMonth()?'disabled':''}>←</button><button data-month="1" aria-label="Nächster Monat" ${month>=10?'disabled':''}>→</button></div></div><div class="calendar">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<span class="weekday">${d}</span>`).join('')}${'<span></span>'.repeat(pad)}`;for(let t=first;t<=last;t+=86400000){const ev=es.filter(e=>iso(e.t)===iso(t));const row={t,view:sum(ev,'view'),start:sum(ev,'start'),finish:sum(ev,'finish'),es:ev};rows.push(row);html+=`<button data-cal="${rows.length-1}" aria-label="${date(t)}: ${row.view} Aufrufe, ${row.start} Starts, ${row.finish} Abschlüsse" ${t<a||t>b?'disabled':''}><span>${new Date(t).getUTCDate()}</span><span class="cal-bars">${metrics.map(m=>`<i class="${row[m.key]&&visible.has(m.key)?'':'zero'}" style="--c:var(${m.color})"></i>`).join('')}</span></button>`}html+='</div>';document.querySelector('#graph').innerHTML=html;document.querySelector('#chart-control').innerHTML='<div class="chart-foot"><span>Tag antippen: alle Ereignisarten gemeinsam sehen</span><span>Farbmarkierung = mindestens ein Ereignis</span></div>';let index=rows.findLastIndex(r=>r.es.length);if(index<0)index=Math.min(rows.length-1,5);selected=index;function choose(i){selected=i;document.querySelectorAll('[data-cal]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.cal===i)));read(rows,null)}document.querySelectorAll('[data-cal]').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.cal)));choose(index)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-theme')){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';return}if(b.dataset.concept!==undefined){concept=+b.dataset.concept;selected=-1;render()}if(b.hasAttribute('data-overview')){view='overview';period='90';selected=-1;render()}if(b.dataset.open!==undefined){share=+b.dataset.open;view='detail';period='90';selected=-1;render();window.scrollTo({top:0,behavior:'instant'})}if(b.dataset.period){period=b.dataset.period;selected=-1;if(period==='live'){liveAnchor=Date.now();paused=false}month=Math.max(new Date(bounds()[0]).getUTCMonth(),9);render()}if(b.dataset.metric){visible.has(b.dataset.metric)?visible.delete(b.dataset.metric):visible.add(b.dataset.metric);render()}if(b.dataset.month){month+=+b.dataset.month;draw()}if(b.hasAttribute('data-pause')){paused=!paused;render()}});
document.addEventListener('change',e=>{if(e.target.id==='share-switch'){share=+e.target.value;selected=-1;render()}if(e.target.type==='date'){if(e.target.value&&e.target.validity.valid){day=e.target.value;selected=-1;render()}else e.target.value=day}});
setInterval(()=>{if(period!=='live'||paused||document.hidden)return;liveAnchor=Date.now();const k=['view','start','finish'][liveSeq++%3];events.push({id:++id,t:liveAnchor,s:share,k,agent:'Safari / iPhone · simulation'});selected=-1;render()},8000);
render();
</script></body></html>
