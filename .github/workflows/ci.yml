name: Checks
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node .github/scripts/release-metadata.mjs
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: docker build --tag sharelyze-ci .
      - run: python3 tests/container_concurrency.py sharelyze-ci
      - run: python3 tests/container_integrity.py sharelyze-ci
