name: Docker image
on:
  push:
    branches: [dev, main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node .github/scripts/release-metadata.mjs
      - run: npm test
      - run: npm run build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "$REF_TYPE:$REF_NAME" in
            branch:main) tag=latest ;;
            branch:dev) tag=dev ;;
            tag:v*) tag="${REF_NAME#v}" ;;
            *) echo "Unsupported ref: $REF_TYPE:$REF_NAME" >&2; exit 1 ;;
          esac
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published platforms
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          platforms="$(docker buildx imagetools inspect "$IMAGE")"
          grep -q 'linux/amd64' <<< "$platforms"
          grep -q 'linux/arm64' <<< "$platforms"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create GitHub release if absent
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/release-metadata.mjs --notes > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "ShareLyze $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
